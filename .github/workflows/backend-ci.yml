name: Backend CI & Quality Gates

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-and-test:
    name: Lint, Test & Security Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cloudpulse
          POSTGRES_PASSWORD: cloudpulse_secret
          POSTGRES_DB: cloudpulse_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install bandit safety pytest-cov

      - name: Ruff Linter Check
        working-directory: ./backend
        run: |
          ruff check app tests

      - name: Ruff Code Formatting Check
        working-directory: ./backend
        run: |
          ruff format --check app tests

      - name: Run Pytest Suite with Coverage
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://cloudpulse:cloudpulse_secret@localhost:5432/cloudpulse_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_super_secret_jwt_signing_key_32_bytes_long
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Bandit Security Vulnerability Scan
        working-directory: ./backend
        run: |
          bandit -r app -ll -x tests

      - name: Safety Dependency Vulnerability Scan
        run: |
          safety check -r backend/requirements.txt --ignore 70612 || true
