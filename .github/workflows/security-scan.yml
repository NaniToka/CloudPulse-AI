name: Security & Vulnerability Scanning

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 4 * * 1'  # Every Monday at 04:00 UTC

jobs:
  security-audit:
    name: Bandit SAST & Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Security Tools
        run: |
          pip install bandit safety

      - name: Run Bandit SAST Security Scan
        run: |
          bandit -r backend/app -ll -x backend/tests

      - name: Audit Backend Dependencies with Safety
        run: |
          safety check -r backend/requirements.txt --ignore 70612 || true

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit Frontend npm Dependencies
        working-directory: ./frontend
        run: |
          npm audit --audit-level=high || true
